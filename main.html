<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>11. Fake Chat</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f0f2f5; }
    .chat-container { max-width: 600px; margin: 40px auto; background: white; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); overflow: hidden; height: 80vh; display: flex; flex-direction: column; }
    .header { background: #0084ff; color: white; padding: 15px; text-align: center; }
    .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 75%; padding: 12px 16px; border-radius: 18px; line-height: 1.4; }
    .sent { align-self: flex-end; background: #0084ff; color: white; border-bottom-right-radius: 4px; }
    .received { align-self: flex-start; background: #e5e5ea; color: black; border-bottom-left-radius: 4px; }
    .input-area { padding: 15px; background: #f0f0f0; display: flex; gap: 10px; }
    input { flex: 1; padding: 14px; border: none; border-radius: 25px; font-size: 16px; }
    button { padding: 0 25px; background: #0084ff; color: white; border: none; border-radius: 25px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="header">Chat bilan Suhbat</div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input type="text" id="messageInput" placeholder="Xabar yozing..." autocomplete="off">
      <button onclick="sendMessage()">Yuborish</button>
    </div>
  </div>

  <script>
    const messagesDiv = document.getElementById('messages');
    const input = document.getElementById('messageInput');

    function addMessage(text, type) {
      const msg = document.createElement('div');
      msg.className = `message ${type}`;
      msg.textContent = text;
      messagesDiv.appendChild(msg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, 'sent');
      input.value = '';

      // Fake javob (1-2 soniyadan keyin)
      setTimeout(() => {
        const replies = ["Tushundim!", "Qiziqarli!", "Ha, to'g'ri.", "Yana nima yangilik?"];
        addMessage(replies[Math.floor(Math.random() * replies.length)], 'received');
      }, 1200);
    }

    // Enter tugmasi bilan yuborish
    input.addEventListener('keypress', e => {
      if (e.key === 'Enter') sendMessage();
    });

    // Boshlang'ich xabar
    addMessage("Salom! Bugun qanday o'tyapti?", 'received');
  </script>
</body>
</html>
